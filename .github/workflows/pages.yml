name: Publish Hermeticon
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble and validate public site
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, json, re
          sha=os.environ['BUILD_SHA']
          assert re.fullmatch('[0-9a-f]{40}',sha)
          root=pathlib.Path('site')
          shutil.copytree('.',root,ignore=shutil.ignore_patterns('.git','site','.github','__pycache__'))
          base=root/'examples/wanderer-separated'
          js=base/'world.js'
          content=js.read_text()
          start=content.index('// Build metadata is stamped by the Pages workflow')
          end=content.index("document.querySelector('#fresh').onclick=()=>location.reload();",start)
          content=content[:start]+f"const BUILD='{sha}';\ndocument.querySelector('#build').textContent=BUILD.slice(0,8);\n"+content[end:]
          js.write_text(content)
          html=base/'index.html'
          page=html.read_text()
          for name in ('world.js','interface.css','errors.js'):
              assert f'./{name}' in page
              page=page.replace(f'./{name}',f'./{name}?v={sha}')
          html.write_text(page)
          (base/'release.json').write_text(json.dumps({'sha':sha})+'\n')
          (root/'build.json').write_text(json.dumps({'sha':sha})+'\n')
          assert all((base/n).is_file() for n in ('index.html','world.js','interface.css','errors.js'))
          print('PUBLIC ENTRY READY',sha)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public entry
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os,time,urllib.request
          sha=os.environ['BUILD_SHA']
          url='https://bonoj.github.io/Hermeticon/examples/wanderer-separated/index.html'
          for i in range(18):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      html=response.read().decode()
                  assert 'world.js?v='+sha in html
                  assert 'interface.css?v='+sha in html
                  print('PUBLIC ENTRY VERIFIED',sha)
                  break
              except Exception as e:
                  print('Awaiting public entry',i+1,str(e))
                  if i==17:raise
                  time.sleep(10)
          PY
