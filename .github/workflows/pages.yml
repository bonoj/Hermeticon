name: Publish Hermeticon
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble and validate public site
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, json, re
          sha=os.environ['BUILD_SHA']
          assert re.fullmatch('[0-9a-f]{40}',sha)
          root=pathlib.Path('site')
          shutil.copytree('.',root,ignore=shutil.ignore_patterns('.git','site','.github','__pycache__'))
          base=root/'examples/wanderer-separated'
          js=base/'world.js'
          content=js.read_text()
          start=content.index('// Build metadata is stamped by the Pages workflow')
          end=content.index("document.querySelector('#fresh').onclick=()=>location.reload();",start)
          content=content[:start]+f"const BUILD='{sha}';\ndocument.querySelector('#build').textContent=BUILD.slice(0,8);\n"+content[end:]
          js.write_text(content)
          athanor=root/'athanor'
          # Wanderer remains a separate stamped regression fixture.
          page=base/'index.html'
          html=page.read_text()
          for name in ('world.js','interface.css','errors.js'):
              asset='./'+name
              assert asset in html
              html=html.replace(asset,f'{asset}?v={sha}')
          page.write_text(html)
          (base/'release.json').write_text(json.dumps({'sha':sha})+'\n')
          (athanor/'release.json').write_text(json.dumps({'sha':sha})+'\n')
          (root/'build.json').write_text(json.dumps({'sha':sha})+'\n')
          assert all((base/n).is_file() and (athanor/n).is_file() for n in ('index.html','world.js','interface.css','errors.js'))
          wanderer=(base/'index.html').read_text()
          assert all(f'./{name}?v={sha}' in wanderer for name in ('world.js','interface.css','errors.js'))
          for entry in (root/'index.html',athanor/'index.html'):
              html=entry.read_text()
              assert 'HERMETICON' in html and 'compose.js' in html
              assert 'world.js' not in html
          assert all((base/n).is_file() for n in ('index.html','world.js','interface.css','errors.js'))
          # Every public entrance must reference the newly deployed Athanor script.
          for entry in (root/'index.html',athanor/'index.html'):
              html=entry.read_text()
              assert 'compose.js' in html
              html=html.replace('compose.js',f'compose.js?v={sha}')
              entry.write_text(html)
          assert (athanor/'athanor.js').is_file()
          instrument=athanor/'athanor.js'
          source=instrument.read_text()
          assert "'../arcana/edge-detection.js'" in source
          assert (root/'arcana/edge-detection.js').is_file()
          instrument.write_text(source.replace("'../arcana/edge-detection.js'",f"'../arcana/edge-detection.js?v={sha}'"))
          assert f"'../arcana/edge-detection.js?v={sha}'" in instrument.read_text()
          edge_source=(root/'arcana/edge-detection.js').read_text()
          assert 'export function createEdgeDetection' in edge_source
          assert "document.querySelector('#buttons').append(edgeButton)" in edge_source
          print('EDGE INSTRUMENT VALIDATED',sha)

          compose=athanor/'compose.js'
          content=compose.read_text()
          assert "'./athanor.js'" in content and "'../codex/genesis/world.js'" in content
          content=content.replace("'./athanor.js'",f"'./athanor.js?v={sha}'").replace("'../codex/genesis/world.js'",f"'../codex/genesis/world.js?v={sha}'")
          compose.write_text(content)
          assert (root/'arcana/hermeticon.js').is_file()
          assert (root/'codex/genesis/world.js').is_file()
          print('PUBLIC ENTRIES READY',sha)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public entry
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os,time,urllib.request
          sha=os.environ['BUILD_SHA']
          for url,marker in (('https://bonoj.github.io/Hermeticon/','HERMETICON'),('https://bonoj.github.io/Hermeticon/athanor/','HERMETICON'),('https://bonoj.github.io/Hermeticon/examples/wanderer-separated/','./world.js?v='+sha)):
              for i in range(36):
                  try:
                      req=urllib.request.Request(url+'?deployment='+sha+'&attempt='+str(i),headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
                      with urllib.request.urlopen(req,timeout=15) as response:
                          html=response.read().decode()
                      assert marker in html
                      print('PUBLIC ENTRY VERIFIED',url,sha)
                      break
                  except Exception as e:
                      print('Awaiting public entry',url,i+1,str(e))
                      if i==35:raise
                      time.sleep(10)
          PY
