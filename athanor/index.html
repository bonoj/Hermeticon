<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101a"><title>Hermeticon · Athanor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101b;color:#d9e6e5;font-family:system-ui,sans-serif}
#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
#title{position:fixed;top:env(safe-area-inset-top,0px);left:0;padding:15px 18px;pointer-events:none;text-shadow:0 2px 8px #000}
h1{font-size:13px;letter-spacing:.22em;margin:0 0 5px;font-weight:600}#buildRow{font:11px/1.5 monospace;color:#a5b9bd;display:flex;gap:12px}
#hud{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
button{min-width:50px;min-height:50px;border:1px solid #9ab4bb88;border-radius:13px;background:#102430d9;color:#e4f3ef;font-size:25px;touch-action:manipulation}
#probePanel{display:none;position:fixed;inset:14% 12px 85px;padding:12px;background:#07121df2;border:1px solid #8ba8b5;border-radius:12px;z-index:2}
#probePanel.open{display:flex;flex-direction:column;gap:10px}
#probeActions{display:flex;gap:8px}#probeActions button{font-size:12px;min-height:40px;padding:0 12px}
#probeText{flex:1;width:100%;resize:none;background:#07121d;color:#d9e6e5;font:12px/1.5 monospace;border:0}
#error{position:fixed;left:12px;right:12px;bottom:85px;color:#ffb9a9;font:12px monospace;pointer-events:none}
</style></head><body>
<div id="stage"></div><div id="title"><h1>ATHANOR</h1><div id="buildRow"><span id="build">--------</span><span id="fps">◌ fps</span></div></div>
<div id="hud"><button id="probe" aria-label="Inspect Athanor" title="Inspect Athanor">👁</button><button id="fresh" aria-label="Refresh Athanor" title="Refresh Athanor">↻</button></div>
<div id="probePanel"><div id="probeActions"><button id="copyProbe">COPY REPORT</button><button id="detailsProbe" aria-expanded="true">DETAILS ▾</button></div><textarea id="probeText" readonly aria-label="Inspection report"></textarea></div><div id="error" role="alert"></div>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=id=>document.getElementById(id);
$('fresh').onclick=()=>location.reload();
try{
 let build='unverified';try{const r=await fetch('../build.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(/^[0-9a-f]{40}$/.test(j.sha))build=j.sha}}catch(e){console.warn('Build metadata unavailable',e)}
 $('build').textContent=build==='unverified'?'--------':build.slice(0,8);
 const scene=new T.Scene();scene.background=new T.Color(0x06101b);scene.fog=new T.FogExp2(0x071827,.012);
 const world=new T.Group();world.name='mount:empty';scene.add(world);
 const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.38;
 $('stage').append(renderer.domElement);
 const camera=new T.PerspectiveCamera(42,1,.1,150);
 scene.add(new T.HemisphereLight(0x82c6dc,0x17202d,1.5));
 const sun=new T.DirectionalLight(0xffc77e,2.4);sun.position.set(-7,13,7);scene.add(sun);
 const blue=new T.PointLight(0x2cbed7,95,36);blue.position.set(2,-2,2);scene.add(blue);
 let angle=.6,elev=.27,dist=27,targetY=0,pinch=0,multiGesture=false;
 const pointers=new Map(),starts=new Map(),TAP_SLOP=12;
 const canvas=renderer.domElement;
 canvas.addEventListener('pointerdown',e=>{if(pointers.size)multiGesture=true;starts.set(e.pointerId,[e.clientX,e.clientY]);pointers.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId)});
 canvas.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  const old=pointers.get(e.pointerId),start=starts.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);const ps=[...pointers.values()];
  if(ps.length===1&&!multiGesture){if(Math.hypot(e.clientX-start[0],e.clientY-start[1])>=TAP_SLOP){angle+=(e.clientX-old[0])*.006;elev=T.MathUtils.clamp(elev+(e.clientY-old[1])*.004,-.4,1.2)}}
  else if(ps.length===2){const d=Math.hypot(ps[0][0]-ps[1][0],ps[0][1]-ps[1][1]);if(pinch)dist=T.MathUtils.clamp(dist*pinch/d,2,100);pinch=d}
 });
 const end=e=>{starts.delete(e.pointerId);pointers.delete(e.pointerId);if(!pointers.size){pinch=0;multiGesture=false}};
 canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
 canvas.addEventListener('wheel',e=>{e.preventDefault();dist=T.MathUtils.clamp(dist+e.deltaY*.022,2,100)},{passive:false});
 let firstFit=true;
 function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();const halfV=T.MathUtils.degToRad(camera.fov)/2,halfH=Math.atan(Math.tan(halfV)*camera.aspect),fit=10.25/Math.sin(Math.min(halfV,halfH))*1.12;if(firstFit){dist=fit;firstFit=false}else dist=T.MathUtils.clamp(dist,2,100)}
 addEventListener('resize',resize);resize();
 const panel=$('probePanel'),report=$('probeText');
 const inspect=()=>({identity:{application:'Athanor',build},mount:{name:world.name,children:world.children.length},observer:{azimuth:angle,elevation:elev,distance:dist,targetY,fieldOfView:camera.fov},lighting:{hemisphere:true,directional:true,point:true},render:{pixelRatio:renderer.getPixelRatio(),width:renderer.domElement.width,height:renderer.domElement.height,framesPerSecond:fps}});
 $('probe').onclick=()=>{if(panel.classList.contains('open')){panel.classList.remove('open');return}report.value=JSON.stringify(inspect(),null,2);panel.classList.add('open')};
 $('copyProbe').onclick=()=>{const value=report.value;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(value).catch(()=>{report.focus();report.select()});else{report.focus();report.select()}};
 $('detailsProbe').onclick=()=>{report.value=JSON.stringify(inspect(),null,2)};
 let fps=null,last=performance.now(),frames=0,windowStart=last;
 function frame(now){requestAnimationFrame(frame);const elapsed=now-last;last=now;if(elapsed>0&&elapsed<250)frames++;if(now-windowStart>=2500){fps=frames*1000/(now-windowStart);$('fps').textContent=fps.toFixed(1)+' fps';frames=0;windowStart=now}
 camera.position.set(Math.sin(angle)*Math.cos(elev)*dist,Math.sin(elev)*dist+targetY,Math.cos(angle)*Math.cos(elev)*dist);camera.lookAt(0,targetY,0);renderer.render(scene,camera)}
 requestAnimationFrame(frame);
}catch(e){$('error').textContent=e.message;console.error(e)}
</script></body></html>
