<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hermeticon · Empty</title>
<style>html,body{margin:0;width:100%;height:100%;background:#07101a;color:#d9eced;font-family:system-ui}main{height:100%;display:grid;place-content:center;text-align:center}h1{font:normal 28px Georgia,serif;letter-spacing:.16em}#worlds{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:12px;display:flex;gap:8px}button{min-height:44px;border:1px solid #6f999e;border-radius:8px;background:#152633;color:#d9eced;padding:8px 14px}#error{color:#ffb7a5;white-space:pre-wrap}</style></head>
<body><main><h1>EMPTY HERMETICON</h1><p id="active">No simulation rules. No matter.</p><p id="error"></p></main><div id="worlds"><button id="new">NEW WORLD</button><button id="next">SWITCH WORLD</button></div>
<script type="module">
import {createHermeticon} from '../../shell/hermeticon.js';
import {mountInstruments} from '../../shell/instruments.js';
const h=createHermeticon({id:'empty-reference'});
h.createWorld({id:'world-1',name:'World 1'});
const active=document.getElementById('active');
function display(){active.textContent='Active: '+h.getWorld()?.name+' · '+h.listWorlds().length+' world(s) · no simulation rules';}
h.subscribe(display);display();
document.getElementById('new').onclick=()=>{const id='world-'+(h.listWorlds().length+1);h.createWorld({id,name:'World '+(h.listWorlds().length+1)});h.selectWorld(id)};
document.getElementById('next').onclick=()=>{const worlds=h.listWorlds();const index=worlds.findIndex(w=>w.id===h.getWorld()?.id);h.selectWorld(worlds[(index+1)%worlds.length].id)};
try{await mountInstruments({hermeticon:h})}catch(e){document.getElementById('error').textContent=String(e)}
</script></body></html>
